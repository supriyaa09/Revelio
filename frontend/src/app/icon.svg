<!--
  The Revelio mark on a deep-forest tile: a cream sheet with its corner turned
  down and the R printed on it.

  Literal hex rather than tokens — a favicon is fetched outside the page, so it
  cannot read CSS custom properties. The values mirror the light-theme tokens
  (--nav, --surface, --accent, --accent-line, --line-2) and the tile keeps the
  mark legible against both a light and a dark browser chrome.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <rect width="120" height="120" rx="26" fill="#24352d" />

  <!-- The sheet -->
  <path
    d="M26 20H74L98 44V102H26Z"
    fill="#fbf8f0"
    stroke="#d5d0c0"
    stroke-width="3"
    stroke-linejoin="round"
  />
  <!-- The underside of the folded corner -->
  <path d="M74 20V44H98Z" fill="#b8c9b0" />
  <path d="M74 20V44H98" fill="none" stroke="#d5d0c0" stroke-width="3" stroke-linejoin="round" />

  <!-- The R -->
  <path
    d="M44 84V44H62A11 11 0 0 1 62 66H44"
    fill="none"
    stroke="#24352d"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M60 66L74 84"
    fill="none"
    stroke="#24352d"
    stroke-width="9"
    stroke-linecap="round"
  />

  <!-- One rule of body copy -->
  <path d="M40 93H68" stroke="#d5d0c0" stroke-width="4.5" stroke-linecap="round" />
</svg>
